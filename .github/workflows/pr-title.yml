name: PR title labels

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify PR title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Parse title and reconcile labels
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node --input-type=module <<'NODE'
          import {
            PR_TYPES,
            flattenLabelPages,
            parsePrTitle,
            reconcileTypeLabels,
          } from "./scripts/pr-title.mjs";

          function requireEnvironment(name) {
            const value = process.env[name];
            if (!value) throw new Error(`Missing required environment variable: ${name}`);
            return value;
          }

          async function githubRequest(path, options = {}) {
            const response = await fetch(`https://api.github.com${path}`, {
              ...options,
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${requireEnvironment("GITHUB_TOKEN")}`,
                "X-GitHub-Api-Version": "2022-11-28",
                ...(options.headers ?? {}),
              },
            });
            if (!response.ok) {
              const body = await response.text();
              throw new Error(`GitHub API request failed (${response.status}): ${body.slice(0, 500)}`);
            }
            return response.status === 204 ? null : response.json();
          }

          async function listAllLabelPages(repo, number) {
            const pages = [];
            for (let page = 1; ; page += 1) {
              const labels = await githubRequest(
                `/repos/${repo}/issues/${number}/labels?per_page=100&page=${page}`,
              );
              if (!Array.isArray(labels)) {
                throw new Error("GitHub labels response was not an array");
              }
              pages.push(labels);
              if (labels.length < 100) return pages;
            }
          }

          async function main() {
            let parsed;
            try {
              parsed = parsePrTitle(process.env.PR_TITLE ?? "");
            } catch (error) {
              console.error(error.message);
              console.error(`Allowed types: ${PR_TYPES.join(", ")}`);
              process.exit(1);
            }

            const repo = requireEnvironment("GITHUB_REPOSITORY");
            const number = requireEnvironment("PR_NUMBER");
            const labelPages = await listAllLabelPages(repo, number);
            const existingLabels = flattenLabelPages(labelPages)
              .map((label) => label?.name)
              .filter(Boolean);
            const reconciliation = reconcileTypeLabels(existingLabels, parsed.label);
            for (const label of reconciliation.remove) {
              await githubRequest(
                `/repos/${repo}/issues/${number}/labels/${encodeURIComponent(label)}`,
                { method: "DELETE" },
              );
            }
            await githubRequest(`/repos/${repo}/issues/${number}/labels`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ labels: reconciliation.add }),
            });
            console.log(`Applied ${parsed.label} to PR #${number}`);
          }

          try {
            await main();
          } catch (error) {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          }
          NODE
