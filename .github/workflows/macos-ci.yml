name: macOS CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULES_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @godgesture/shared build

      - name: Validate desktop frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          pnpm --filter @godgesture/desktop test
          pnpm --filter @godgesture/desktop typecheck
          pnpm --filter @godgesture/desktop build

      - name: Test native Rust target
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Gate Node plugin host performance
        shell: bash
        run: |
          set -o pipefail
          {
            sw_vers
            uname -m
            node --version
            cargo test \
              --manifest-path apps/desktop/src-tauri/Cargo.toml \
              --release \
              engine::node_host::tests::node_host_performance_gate \
              -- --ignored --exact --nocapture
          } 2>&1 | tee node-host-performance.log

      - name: Upload Node plugin host performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-host-performance-macos-${{ runner.arch }}
          path: node-host-performance.log
          if-no-files-found: warn
          retention-days: 30

      - name: Check both macOS architectures
        run: |
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --target aarch64-apple-darwin
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-apple-darwin
