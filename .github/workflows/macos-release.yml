name: macOS free DMG release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test desktop frontend
        run: pnpm --filter @godgesture/desktop test

      - name: Test Rust library
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

      - name: Require tag to match application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version=$(node -p "JSON.parse(require('fs').readFileSync('apps/desktop/src-tauri/tauri.conf.json', 'utf8')).version")
          package_version=$(node -p "JSON.parse(require('fs').readFileSync('apps/desktop/package.json', 'utf8')).version")
          test "$tag_version" = "$app_version"
          test "$tag_version" = "$package_version"

      - name: Build ad-hoc universal application and DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm --filter @godgesture/desktop tauri build --ci --target universal-apple-darwin --bundles app,dmg

      - name: Verify and prepare release files
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          app_path="$bundle_root/macos/GodGesture.app"
          executable_path="$app_path/Contents/MacOS/GodGesture"
          dmg_count=$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')
          dmg_path=$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          version=$(node -p "JSON.parse(require('fs').readFileSync('apps/desktop/src-tauri/tauri.conf.json', 'utf8')).version")
          release_dir="apps/desktop/src-tauri/target/release-artifacts"
          release_name="GodGesture_${version}_universal.dmg"

          test -d "$app_path"
          test -x "$executable_path"
          test "$dmg_count" = "1"
          test -n "$dmg_path"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q 'Signature=adhoc'

          architectures=$(lipo -archs "$executable_path")
          case " $architectures " in *" arm64 "*) ;; *) echo "Missing arm64 slice" >&2; exit 1 ;; esac
          case " $architectures " in *" x86_64 "*) ;; *) echo "Missing x86_64 slice" >&2; exit 1 ;; esac

          hdiutil verify "$dmg_path"
          mkdir -p "$release_dir"
          cp "$dmg_path" "$release_dir/$release_name"
          cd "$release_dir"
          shasum -a 256 "$release_name" > "$release_name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: GodGesture-macOS-universal-ad-hoc
          path: apps/desktop/src-tauri/target/release-artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GodGesture-macOS-universal-ad-hoc
          path: release-artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          fail_on_unmatched_files: true
          body: |
            This macOS DMG is free, ad-hoc signed, and not notarized by Apple.

            After copying GodGesture to Applications, the first launch may require Finder > Open or System Settings > Privacy & Security > Open Anyway. Accessibility and Input Monitoring permissions are granted separately after launch.

            Verify the downloaded DMG against the attached SHA-256 checksum before opening it.
