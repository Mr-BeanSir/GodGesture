[package]
name = "godgesture"
version = "0.1.0"
description = "GodGesture — cross-platform mouse gestures with cloud sync"
authors = ["GodGesture contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "godgesture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
tiny-skia = "0.11"
ab_glyph = "0.2"
log = "0.4"
env_logger = "0.11"
rquickjs = "0.10"
keyring = { version = "4.1.5", default-features = false, features = ["v1"] }
url = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "stream", "system-proxy"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Com",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_TaskScheduler",
  "Win32_System_Variant",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_Security",
  "Win32_Security_Authorization",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-application-services = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
