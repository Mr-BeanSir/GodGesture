# 本地开发:只起 PostgreSQL,Node 进程跑在宿主机(ADR-0004)。
# POSTGRES_HOST_PORT 可覆盖宿主机端口;容器内始终监听 5432。
#   docker compose -f docker-compose.dev.yml up -d
name: godgesture-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: godgesture-dev-postgres
    environment:
      POSTGRES_USER: godgesture
      POSTGRES_PASSWORD: godgesture
      POSTGRES_DB: godgesture
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U godgesture -d godgesture']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
